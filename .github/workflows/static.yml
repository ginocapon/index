# Deploy static content to GitHub Pages (job unico: build + deploy)
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync Open Graph immobili (anteprima social)
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -n "$SUPABASE_KEY" ]; then
            python3 scripts/sync_og_immobili.py
          else
            echo "SUPABASE_KEY assente — deploy con share-immobile-*.html già in repo"
            ls share-immobile-*.html 2>/dev/null | wc -l || true
          fi

      - name: Build SEO redirects (404 + stub 301)
        run: python3 scripts/build_seo_redirects.py

      - name: Prepara artifact Pages (solo file pubblici)
        run: |
          mkdir -p _pages_site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.cursor' \
            --exclude '.claude' \
            --exclude 'TEST-SKILL' \
            --exclude 'righetto_social' \
            --exclude 'scripts' \
            --exclude 'documenti' \
            --exclude 'tools' \
            --exclude 'sql' \
            --exclude 'supabase' \
            --exclude 'docs' \
            --exclude 'templates' \
            --exclude 'lunedi-email-report.html' \
            --exclude '_pages_site' \
            --exclude 'CLAUDE.md' \
            --exclude 'SKILL-2.0.md' \
            --exclude 'skimm.md' \
            --exclude '*.py' \
            --exclude 'node_modules' \
            --exclude 'tests' \
            --exclude 'test-results' \
            --exclude 'playwright-report' \
            ./ _pages_site/
          echo "Dimensione artifact:"
          du -sh _pages_site
          find _pages_site -type f | wc -l
          if [ -d documenti/perizie ]; then
            mkdir -p _pages_site/documenti/perizie
            cp -a documenti/perizie/. _pages_site/documenti/perizie/
            echo "Perizie PDF incluse nel deploy:"
            ls -la _pages_site/documenti/perizie/
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Rimuovi artifact github-pages duplicati (re-run sicuro)
        uses: geekyeggo/delete-artifact@v5
        with:
          name: github-pages
          failOnError: false

      - name: Upload Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_pages_site'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
