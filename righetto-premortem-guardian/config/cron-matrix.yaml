version: 1

# Tutti i job possono passare dal medesimo dispatcher.
# Il cron esterno può quindi richiamare sempre:
# node ./righetto-premortem-guardian/scripts/guardian.mjs run

jobs:
  heartbeat:
    every: 5m
    scope: [availability, api, workers]

  transaction_sentinel:
    every: 15m
    scope: [leads, forms, conversion]

  anomaly_engine:
    every: 1h
    scope: [analytics, seo, business, performance]

  ai_quality:
    every: 4h
    scope: [ai_quality]

  site_integrity:
    every: 4h
    scope: [seo, performance, structured_data, links]

  content_freshness:
    every: 1d
    scope: [content, seo]

  web_keyword_discovery:
    on: "friday"
    at: "05:00"
    scope: [web_keywords, content, seo, business]

  daily_premortem:
    at: "18:00"
    scope: [all]

  weekly_strategy:
    on: "monday"
    at: "08:00"
    scope: [business, seo, content, competition, web_keywords]

  weekly_red_team:
    on: "friday"
    at: "17:00"
    scope: [strategy, assumptions, business, security]

  monthly_full_premortem:
    day: 1
    at: "08:00"
    scope: [all]

  quarterly_future_scenarios:
    months: [1, 4, 7, 10]
    day: 1
    at: "08:00"
    scope: [strategy, business, technology]
