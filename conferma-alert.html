<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>Avvisi immobiliari | Righetto Immobiliare</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f2;color:#203c30;font:16px/1.5 Arial,sans-serif}header{background:#18583e;color:white;padding:21px 24px;letter-spacing:2px;font-weight:bold}main{max-width:860px;margin:28px auto;padding:0 18px}.preview{background:#fff2cb;color:#5d4715;padding:12px 16px;border:1px solid #ddce9b;font-size:14px}.box{background:white;border:1px solid #ccd8cf;padding:30px;margin-top:18px}h1{font:32px/1.2 Georgia,serif;margin:0 0 12px}h2{font-size:20px;margin:26px 0 12px}p{margin:8px 0 18px}label{display:block;font-weight:bold;margin:14px 0 5px}input,select,button{font:16px Arial;min-height:46px;width:100%;border:1px solid #9aaca1;padding:10px;background:white;color:#203c30;border-radius:3px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}.small{font-size:14px;color:#52655a}.check{display:flex;align-items:flex-start;gap:10px;font-weight:normal;margin:14px 0}.check input{width:20px;height:20px;min-height:20px;flex-shrink:0;margin:2px 0}.cta{background:#18583e;color:white;border:0;cursor:pointer;margin-top:18px;font-weight:bold}.note{padding:12px;background:#eef4ef;border-left:3px solid #42735a}.result{background:#fff2cb;padding:14px;color:#5d4715;margin-top:15px}a{color:#18583e}@media(max-width:600px){main{margin:16px auto}.box{padding:20px}h1{font-size:28px}.grid{grid-template-columns:1fr}header{padding:16px 18px}}
.home-return{display:inline-flex;align-items:center;justify-content:center;gap:8px;margin-top:22px;padding:12px 20px;min-height:46px;border:1px solid #18583e;border-radius:3px;color:#18583e;background:#fff;text-decoration:none;font-weight:bold}.home-return:hover{background:#eef4ef}.home-return:focus-visible{outline:3px solid #FF6B35;outline-offset:3px}</style></head><body>
<header>RIGHETTO IMMOBILIARE</header><main><section class="box"><h1 id="h">Avvisi immobiliari</h1>
<p id="p"></p><button class="cta" id="go" type="button" hidden></button><div id="result" role="status" hidden class="result"></div>
<p class="small">Per qualsiasi dubbio scrivici a <a href="mailto:info@righettoimmobiliare.it">info@righettoimmobiliare.it</a> o chiama il 049 8843484.</p><a class="home-return" href="https://righettoimmobiliare.it/"><span aria-hidden="true">←</span> Torna alla home</a></section></main>
<script>
(function(){
var FN='https://qwkwkemuabfwvwuqrxlu.supabase.co/functions/v1/clever-service';
var q=new URLSearchParams(location.search),a=q.get('a'),s=q.get('s'),c=q.get('c'),t=q.get('t');
history.replaceState(null,'',location.pathname); // il codice personale non resta nell'indirizzo
var h=document.getElementById('h'),p=document.getElementById('p'),go=document.getElementById('go'),r=document.getElementById('result'),busy=false;
function msg(x){r.hidden=false;r.textContent=x}
var okLink=(a==='confirm'||a==='unsubscribe')&&s&&t&&(a==='unsubscribe'||c);
if(!okLink){h.textContent='Link non valido';p.textContent='Il link non è completo. Apri di nuovo il link dall\'email che hai ricevuto.';return}
if(a==='confirm'){h.textContent='Conferma gli avvisi';p.textContent='Premi il pulsante per attivare gli avvisi immobiliari che hai richiesto.';go.textContent='Conferma gli avvisi'}
else{h.textContent='Disiscriviti';p.textContent='Premi il pulsante per non ricevere più avvisi immobiliari.';go.textContent='Disiscrivimi'}
go.hidden=false;
go.addEventListener('click',function(){
 if(busy)return;busy=true;go.disabled=true;msg('Un momento...');
 var body={action:a,s:s,t:t};if(a==='confirm')body.c=c;
 fetch(FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
 .then(function(x){return x.json()}).then(function(j){busy=false;
  var m=j&&j.result;
  if(a==='confirm'){
   if(m==='confirmed'){go.hidden=true;msg('Fatto: gli avvisi sono attivi. Puoi disiscriverti in qualsiasi momento dal link in ogni email.')}
   else if(m==='existing'){go.hidden=true;msg('Gli avvisi erano già attivi.')}
   else if(m==='expired'){go.hidden=true;msg('Il link è scaduto (vale 24 ore). Compila di nuovo il modulo per ricevere un nuovo link.')}
   else if(m==='revoked'){go.hidden=true;msg('Questa iscrizione è stata annullata. Se vuoi gli avvisi, compila di nuovo il modulo.')}
   else if(m==='consent_review'){go.hidden=true;msg('L\'informativa è cambiata: compila di nuovo il modulo per confermare.')}
   else{go.disabled=false;msg('Link non valido. Apri di nuovo il link dall\'email o scrivici.')}
  }else{
   if(m==='revoked'||m==='existing'){go.hidden=true;msg('Fatto: non riceverai più avvisi.')}
   else{go.disabled=false;msg('Link non valido. Scrivici a info@righettoimmobiliare.it e ti disiscriviamo noi.')}
  }})
 .catch(function(){busy=false;go.disabled=false;msg('Collegamento non riuscito. Riprova tra poco.')});
});
})();
</script></body></html>
