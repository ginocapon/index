<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recensione Google — Righetto Immobiliare</title>
<meta name="robots" content="noindex, follow">
<meta name="description" content="Link ufficiale per lasciare una recensione su Google a Righetto Immobiliare Limena.">
<link rel="canonical" href="https://righettoimmobiliare.it/qr-review">
<script src="js/ga-consent.js?v=3" defer></script>
</head>
<body>
<p>Reindirizzamento alla pagina Google per la recensione…</p>
<script>
(function () {
  var TARGET = 'https://maps.app.goo.gl/xuCiRGDCSKskpTSf6?g_st=ic';
  try {
    var n = parseInt(localStorage.getItem('rig_qr_review_count') || '0', 10) + 1;
    localStorage.setItem('rig_qr_review_count', String(n));
  } catch (e) { /* ignore */ }
  location.replace(TARGET);
})();
</script>
</body>
